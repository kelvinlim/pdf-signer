name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

env:
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev
    libgtk-3-dev
    libappindicator3-dev
    librsvg2-dev
    patchelf
    xdg-utils
    libfuse2
    pkg-config

jobs:
  test:
    name: tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            artifact: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
            artifact: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          - os: ubuntu-22.04
            name: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
            artifact: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Read app version
        id: app-version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "app version=$version"

      # Version in the cache key so a bump cannot reuse incremental tauri-build
      # artifacts that still embed the previous frontend. Tag builds skip the
      # cache entirely so a release never links a stale target/.
      - name: Rust cache
        if: github.ref_type != 'tag'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: app-v${{ steps.app-version.outputs.version }}

      - name: Install frontend dependencies
        run: npm ci

      # macOS signing is optional: without the Apple secrets the app is built
      # unsigned (Gatekeeper will warn on first launch). Secrets are only read
      # into env here so a missing one yields an empty value, not a failed step.
      - name: Check Apple signing secrets
        id: signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_API_KEY_CONTENT" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets not set; building an unsigned macOS app."
          fi

      - name: Write App Store Connect API key
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build (unsigned, no release)
        if: steps.signing.outputs.signed != 'true' && !startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}

      - name: Build and draft release (unsigned)
        if: steps.signing.outputs.signed != 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "PDF Signer v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build (macOS, signed)
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          set -euo pipefail
          npm run tauri -- build --target aarch64-apple-darwin

      # Tauri notarizes the .app; Gatekeeper still checks the DMG wrapper.
      - name: Notarize and staple DMG
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          dmg=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg"

      - name: Attach DMG to GitHub Release
        if: steps.signing.outputs.signed == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dmg=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$dmg" \
              --draft \
              --title "PDF Signer ${GITHUB_REF_NAME#v}" \
              --notes "See the assets to download this version and install."
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-signer-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
